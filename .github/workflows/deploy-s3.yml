name: Self-Healing Deploy

# What this does, in plain English:
#   1. Save a copy of the file that is live right now  (the "backup")
#   2. Upload the new file                              (aws s3 cp)
#   3. Clear the CDN cache                              (create-invalidation)
#   4. Open the website and check it                    (curl)
#   5. If the check fails -> put the backup back        (aws s3 cp)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Only one deploy at a time, and never kill one halfway through.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  FILE:      index.html                        # the file we deploy
  BUCKET:    vignesh-web-2k26                  # S3 bucket name
  BACKUP:    backups/index-previous.html       # where we keep the old copy
  REGION:    ap-south-1
  DIST_ID:   E1MG8RKBCM89YT                    # CloudFront distribution
  SITE_URL:  https://d38etqdlxtduo5.cloudfront.net
  MARKER:    SITE-OK                           # this word must appear in the page

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---------- 0. get the code + AWS login ----------

      - uses: actions/checkout@v4

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.REGION }}

      # ---------- 1. check the file before uploading ----------

      - name: Check the file looks OK
        run: grep -q "$MARKER" "$FILE"

      # ---------- 2. save a copy of what is live now ----------

      - name: Save a backup of the live file
        id: backup
        run: |
          # Copy the live file into a backup folder. If nothing is live yet
          # (very first deploy) the copy fails, and that is fine.
          if aws s3 cp "s3://$BUCKET/$FILE" "s3://$BUCKET/$BACKUP"; then
            echo "have_backup=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing live yet - first deploy, no backup to take."
          fi

      # ---------- 3. upload the new file ----------

      - name: Upload to S3
        run: aws s3 cp "$FILE" "s3://$BUCKET/$FILE" --cache-control no-cache

      # ---------- 4. clear the CDN cache ----------

      - name: Clear CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          sleep 30

      # ---------- 5. open the site and check it ----------

      - name: Check the live website
        run: |
          # -f          = fail if the page is not HTTP 200
          # --retry 5   = curl retries by itself, so we need no loop
          curl -sf --retry 5 --retry-delay 10 -o page.html "$SITE_URL/"
          grep -q "$MARKER" page.html
          echo "Site is healthy."

      # ---------- 6. rollback (only if something above failed) ----------

      - name: Put the backup back
        if: failure() && steps.backup.outputs.have_backup == 'yes'
        run: |
          aws s3 cp "s3://$BUCKET/$BACKUP" "s3://$BUCKET/$FILE" --cache-control no-cache
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          sleep 30

      - name: Check the site again after rollback
        if: failure() && steps.backup.outputs.have_backup == 'yes'
        run: |
          curl -sf --retry 5 --retry-delay 10 -o page.html "$SITE_URL/"
          grep -q "$MARKER" page.html
          echo "::warning::Deploy failed, but the old version is live and healthy."

      # ---------- 7. write a little report ----------

      - name: Report
        if: always()
        run: |
          {
            echo "### Deploy report"
            echo ""
            echo "- Site: $SITE_URL"
            echo "- Backup kept at: \`s3://$BUCKET/$BACKUP\`"
            echo ""
            echo "To roll back by hand:"
            echo '```bash'
            echo "aws s3 cp s3://$BUCKET/$BACKUP s3://$BUCKET/$FILE --cache-control no-cache"
            echo "aws cloudfront create-invalidation --distribution-id $DIST_ID --paths '/*'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
