name: 2 - Deploy to CDN

on:
  push:
    branches: [ master ]

# ===== variables - inga mattum maathu =====
env:
  BUCKET: vignesh-web-2k26
  DIST_ID: E1MG8RKBCM89YT
  CDN_URL: d38etqdlxtduo5.cloudfront.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: get the code
      - uses: actions/checkout@v4

      # Step 2: login to AWS
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Step 3: upload to S3
      - name: Deploy
        run: aws s3 cp index.html s3://$BUCKET/index.html

      # Step 4: clear the CloudFront cache
      - name: Clear CDN cache
        run: aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/index.html"

      # Step 5: wait, then health check through the CDN
      - name: Health check
        run: |
          sleep 30
          curl -s $CDN_URL/ | grep "SITE-OK" && echo "PASSED" || echo "FAILED"

