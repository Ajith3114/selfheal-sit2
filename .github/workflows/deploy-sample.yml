name: Sample Deploy (students)

# A safe playground copy of the deploy pipeline.
#   - it only touches sample.html, never the real index.html
#   - it does NOT use CloudFront, so it works before the AWS account
#     is verified for CloudFront
#
# The idea in 5 steps:
#   1. save a copy of the file that is live now   (aws s3 cp)
#   2. upload the new file                        (aws s3 cp)
#   3. download it back and look for the marker   (aws s3 cp + grep)
#   4. if the marker is missing -> put the backup back
#   5. tell us what happened

on:
  push:
    branches: [ master ]
    paths: [ 'sample.html' ]      # only run when the demo file changes
  workflow_dispatch:

concurrency:
  group: deploy-sample
  cancel-in-progress: false

permissions:
  contents: read

env:
  FILE:    sample.html                          # the file we deploy
  BUCKET:  6f-school-of-it                      # S3 bucket name
  KEY:     sample.html                          # name it gets inside the bucket
  BACKUP:  backups/sample-previous.html         # where we keep the old copy
  REGION:  ap-south-1
  MARKER:  SITE-OK                              # this word must be in the page

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.REGION }}

      # ---------- 1. save a copy of what is live now ----------

      - name: Save a backup of the live file
        id: backup
        run: |
          if aws s3 cp "s3://$BUCKET/$KEY" "s3://$BUCKET/$BACKUP"; then
            echo "have_backup=yes" >> "$GITHUB_OUTPUT"
            echo "Backup saved."
          else
            echo "Nothing live yet - first deploy, no backup to take."
          fi

      # ---------- 2. upload the new file ----------

      - name: Upload to S3
        run: aws s3 cp "$FILE" "s3://$BUCKET/$KEY" --cache-control no-cache

      # ---------- 3. download it back and check it ----------

      - name: Check the uploaded file
        run: |
          aws s3 cp "s3://$BUCKET/$KEY" live.html
          grep -q "$MARKER" live.html
          echo "Marker found - the deploy is good."

      # ---------- 4. rollback, only if step 3 failed ----------

      - name: Put the backup back
        if: failure() && steps.backup.outputs.have_backup == 'yes'
        run: |
          aws s3 cp "s3://$BUCKET/$BACKUP" "s3://$BUCKET/$KEY" --cache-control no-cache
          echo "Old version restored."

      - name: Check the old version is good
        if: failure() && steps.backup.outputs.have_backup == 'yes'
        run: |
          aws s3 cp "s3://$BUCKET/$KEY" live.html
          grep -q "$MARKER" live.html
          echo "::warning::Deploy failed, but the previous version is back and healthy."

      # ---------- 5. report ----------

      - name: Report
        if: always()
        run: |
          {
            echo "### Sample deploy report"
            echo ""
            echo "- File: \`$FILE\` -> \`s3://$BUCKET/$KEY\`"
            echo "- Backup: \`s3://$BUCKET/$BACKUP\`"
            echo ""
            echo "To roll back by hand:"
            echo '```bash'
            echo "aws s3 cp s3://$BUCKET/$BACKUP s3://$BUCKET/$KEY --cache-control no-cache"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
