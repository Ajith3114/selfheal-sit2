name: 3 - Auto-Fix Agent

# Optional. Runs only when Self-Healing Deploy fails.
# Uses Claude on Bedrock, so no Anthropic API key is needed.

on:
  workflow_run:
    workflows: [ "Self-Healing Deploy" ]
    types: [ completed ]
  workflow_dispatch:

concurrency:
  group: autofix
  cancel-in-progress: true

env:
  # The "global." prefix is required, the bare model id is rejected.
  BEDROCK_MODEL:  amazon.nova-2-sonic-v1:0
  BEDROCK_REGION: us-west-2

jobs:
  autofix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.BEDROCK_REGION }}

      - name: Claude diagnoses and opens a fix PR
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            The deploy workflow "Self-Healing Deploy" just failed. The site was
            already rolled back, so production is safe. Fix the code that caused it.

            1. Read the real error first, do not assume:
                 gh run view ${{ github.event.workflow_run.id }} --log-failed

            2. Decide if it is a code problem. Only the contents of index.html
               are yours to fix. AWS errors, expired credentials and CDN
               timeouts are infrastructure - for those, open no PR and just
               report what you found.

            3. If it is a code problem, fix index.html on a new branch. Then
               prove it by running the same check the pipeline runs:
                 python check-html.py index.html
               It must print OK. Do not open a PR while it still prints FAIL.

            4. Open a pull request explaining the cause in plain language, for
               someone learning AWS for the first time. Paste the passing
               check-html.py output into the PR body.

            Read check-html.py - it is short, and it defines what "valid" means
            here. index.html is only a few KB, so read it in full.

            Rules:
            - Do not modify any workflow file or the rollback logic.
            - Only fix index.html.
            - If the cause is not clear, open no PR and explain why.
          claude_args: |
            --model ${{ env.BEDROCK_MODEL }}
            --max-turns 40
            --allowedTools "Read,Edit,Grep,Glob,Bash"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
