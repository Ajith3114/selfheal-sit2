name: 3 - Auto-Fix Agent

# Optional. Runs only when Self-Healing Deploy fails.
#
# Uses a model on Amazon Bedrock through the Converse API, so the only
# credentials involved are the AWS ones already in this repo's secrets.
# No Anthropic account, no OpenAI account, no API key of any kind.
#
# The model choice is just the BEDROCK_MODEL_ID below. Any Bedrock model that
# supports Converse will work; swapping vendors is a one-line change.

on:
  workflow_run:
    workflows: [ "Self-Healing Deploy" ]
    types: [ completed ]
  workflow_dispatch:

concurrency:
  group: autofix
  cancel-in-progress: true

env:
  # On bedrock-runtime this model has NO in-Region inference, so the ID must
  # name a cross-Region inference profile. "us." is the geo profile, and
  # "global." also works. A bare "openai.gpt-5.6-luna" is rejected.
  BEDROCK_MODEL_ID: us.openai.gpt-5.6-luna
  BEDROCK_REGION:   us-west-2

jobs:
  autofix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.BEDROCK_REGION }}

      - name: Install the AWS SDK
        run: pip install --quiet boto3

      - name: Diagnose the failure and open a fix PR
        run: python .github/scripts/autofix.py
        env:
          BEDROCK_MODEL_ID: ${{ env.BEDROCK_MODEL_ID }}
          BEDROCK_REGION:   ${{ env.BEDROCK_REGION }}
          RUN_ID:           ${{ github.event.workflow_run.id }}
          TARGET_FILE:      index.html
          CHECKER:          check-html.py
          BASE_BRANCH:      master
          GH_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
